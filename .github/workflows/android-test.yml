name: Build Android TEST APK

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test-apk:
    name: Build debug APK (TEST only)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Install locked dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build Android TEST APK
        run: flutter build apk --debug --no-pub --build-name=0.1.0 --build-number=1
      - name: Label test artifact
        run: cp build/app/outputs/flutter-apk/app-debug.apk build/app/outputs/flutter-apk/mon-ecole-android-test.apk
      - name: Upload test APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: mon-ecole-android-test
          path: build/app/outputs/flutter-apk/mon-ecole-android-test.apk
          if-no-files-found: error
          retention-days: 7
