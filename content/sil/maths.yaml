level: sil
subject: maths

chapters:
  - id: chiffres-0-5
    title: "Les chiffres de 0 à 5"
    lesson:
      - text: "Voici les chiffres : 0, 1, 2, 3, 4, 5."
      - text: "1 🍎  Un, c'est une seule pomme."
        speak: "Un, c'est une seule pomme."
      - text: "2 🍎🍎  Deux, c'est une paire."
        speak: "Deux, c'est une paire."
      - text: "3 🍎🍎🍎  Trois."
        speak: "Trois pommes."
      - text: "4 🍎🍎🍎🍎  Quatre."
        speak: "Quatre pommes."
      - text: "5 🍎🍎🍎🍎🍎  Cinq."
        speak: "Cinq pommes."
      - text: "0  Zéro, c'est quand il n'y a rien du tout."
        speak: "Zéro, c'est quand il n'y a rien du tout."
    exercises:
      - type: qcm
        text: "Combien y a-t-il de bananes ? 🍌🍌🍌"
        options: ["2", "3", "4"]
        answer: "3"
        explanation: "Il y a 3 bananes : 1, 2, 3."
      - type: qcm
        text: "Combien y a-t-il d'ananas ? 🍍🍍🍍🍍🍍"
        options: ["4", "5", "3"]
        answer: "5"
        explanation: "Il y a 5 ananas : 1, 2, 3, 4, 5."
      - type: association
        text: "Relie chaque chiffre au bon nombre de pommes."
        pairs:
          "1": "🍎"
          "2": "🍎🍎"
          "3": "🍎🍎🍎"
        explanation: "Le chiffre dit combien il y a de pommes."
      - type: ordre
        text: "Mets les chiffres dans l'ordre, du plus petit au plus grand."
        order: ["1", "2", "3", "4"]
        explanation: "On compte : 1, 2, 3, 4."
      - type: vrai_faux
        text: "Zéro, c'est quand il n'y a rien du tout."
        answer: vrai
        explanation: "Zéro veut dire : il n'y en a pas."
      - type: saisie
        text: "Combien d'oranges ? Écris le chiffre. 🍊🍊🍊🍊"
        keyboard: number
        accepted: ["4"]
        explanation: "Il y a 4 oranges."

  - id: chiffres-6-10
    title: "Les chiffres de 6 à 10"
    lesson:
      - text: "Après 5, on compte : 6, 7, 8, 9, 10."
      - text: "Dix, c'est comme les dix doigts de tes deux mains ✋✋"
      - text: "Plus on avance dans les chiffres, plus il y a d'objets."
    exercises:
      - type: qcm
        text: "Quel chiffre vient après 6 ?"
        options: ["5", "7", "8"]
        answer: "7"
        explanation: "On compte : 5, 6, 7."
      - type: qcm
        text: "Combien de doigts as-tu sur tes deux mains ?"
        options: ["5", "10", "8"]
        answer: "10"
        explanation: "5 doigts et 5 doigts, ça fait 10 doigts."
      - type: qcm
        text: "Combien y a-t-il de raisins ? 🍇🍇🍇🍇🍇🍇🍇🍇"
        options: ["7", "8", "9"]
        answer: "8"
        explanation: "Il y a 8 raisins."
      - type: ordre
        text: "Remets les chiffres dans l'ordre."
        order: ["6", "7", "8", "9", "10"]
        explanation: "On compte : 6, 7, 8, 9, 10."
      - type: saisie
        text: "Quel chiffre vient juste avant 10 ? Écris-le."
        keyboard: number
        accepted: ["9"]
        explanation: "Avant 10, il y a 9."
      - type: vrai_faux
        text: "8 vient après 7."
        answer: vrai
        explanation: "On compte : 7, 8."

  - id: plus-moins-autant
    title: "Plus, moins, autant"
    lesson:
      - text: "Plus : 🍌🍌🍌🍌 est plus que 🍌🍌."
        speak: "Plus. Quatre bananes, c'est plus que deux bananes."
      - text: "Moins : 🍌🍌 est moins que 🍌🍌🍌🍌."
        speak: "Moins. Deux bananes, c'est moins que quatre bananes."
      - text: "Autant : 🍌🍌🍌 et 🍌🍌🍌, c'est autant."
        speak: "Autant. Trois bananes et trois bananes, c'est autant."
    exercises:
      - type: qcm
        text: "Où y a-t-il le plus de ballons ?"
        options: ["⚽⚽", "⚽⚽⚽⚽"]
        answer: "⚽⚽⚽⚽"
        explanation: "4 ballons, c'est plus que 2 ballons."
      - type: qcm
        text: "Où y a-t-il le moins de fleurs ?"
        options: ["🌸🌸🌸🌸🌸", "🌸🌸"]
        answer: "🌸🌸"
        explanation: "2 fleurs, c'est moins que 5 fleurs."
      - type: vrai_faux
        text: "4 est plus grand que 2."
        answer: vrai
        explanation: "On compte : 2, 3, 4. Donc 4 est plus grand."
      - type: qcm
        text: "Quel nombre est le plus petit ?"
        options: ["5", "2", "4"]
        answer: "2"
        explanation: "2 est le plus petit des trois."
      - type: qcm
        text: "Awa a 3 mangues et Paul a 3 mangues. Ont-ils plus, moins ou autant ?"
        options: ["Plus", "Moins", "Autant"]
        answer: "Autant"
        explanation: "3 et 3, c'est autant."

  - id: formes
    title: "Les formes : rond, carré, triangle"
    lesson:
      - text: "Un rond 🔴 comme le soleil."
      - text: "Un carré ⬛ a quatre côtés pareils."
      - text: "Un triangle 🔺 a trois côtés."
    exercises:
      - type: qcm
        text: "Quelle forme est un rond ?"
        options: ["🔴", "⬛", "🔺"]
        answer: "🔴"
        explanation: "Le rond est tout rond, sans coin."
      - type: qcm
        text: "Quelle forme est un carré ?"
        options: ["🔴", "⬛", "🔺"]
        answer: "⬛"
        explanation: "Le carré a quatre côtés pareils."
      - type: qcm
        text: "Quelle forme est un triangle ?"
        options: ["🔴", "⬛", "🔺"]
        answer: "🔺"
        explanation: "Le triangle a trois côtés."
      - type: association
        text: "Relie chaque forme à son nom."
        pairs:
          "🔴": "rond"
          "⬛": "carré"
          "🔺": "triangle"
        explanation: "Rond, carré, triangle."
      - type: qcm
        text: "Le soleil ressemble à un…"
        speak: "Le soleil ressemble à quelle forme ?"
        options: ["rond", "carré", "triangle"]
        answer: "rond"
        explanation: "Le soleil est tout rond."
      - type: vrai_faux
        text: "Un triangle a trois côtés."
        answer: vrai
        explanation: "Tri veut dire trois."

  - id: se-reperer
    title: "Se repérer : dessus, dessous, devant, derrière"
    lesson:
      - text: "Dessus, c'est sur la table. Dessous, c'est sous la table."
      - text: "Devant, c'est en face de toi. Derrière, c'est dans ton dos."
      - text: "Le chat 🐱 est sous la chaise : il est dessous."
    exercises:
      - type: qcm
        text: "Le livre est sur la table. Le livre est…"
        speak: "Le livre est sur la table. Le livre est où ?"
        options: ["dessus", "dessous", "derrière"]
        answer: "dessus"
        explanation: "Sur la table, c'est dessus."
      - type: qcm
        text: "Le chat est sous la chaise. Le chat est…"
        speak: "Le chat est sous la chaise. Le chat est où ?"
        options: ["dessous", "dessus", "devant"]
        answer: "dessous"
        explanation: "Sous la chaise, c'est dessous."
      - type: association
        text: "Relie chaque expression au bon mot."
        pairs:
          "sur la table": "dessus"
          "sous la table": "dessous"
          "en face de moi": "devant"
          "dans mon dos": "derrière"
        explanation: "Dessus, dessous, devant, derrière."
      - type: qcm
        text: "Awa est face à la porte. Paul est dans son dos. Qui est derrière ?"
        options: ["Paul", "Awa"]
        answer: "Paul"
        explanation: "Paul est dans le dos d'Awa : il est derrière."
      - type: vrai_faux
        text: "Derrière veut dire dans le dos."
        answer: vrai
        explanation: "Derrière, c'est dans le dos."
      - type: vrai_faux
        text: "Le ballon est au-dessus de la table : il est dessous."
        answer: faux
        explanation: "Au-dessus de la table, c'est dessus."

  - id: suites-logiques
    title: "Les suites logiques"
    lesson:
      - text: "Une suite, c'est un dessin qui se répète toujours de la même façon."
      - text: "🔴 🔵 🔴 🔵 🔴 … ensuite vient 🔵."
        speak: "Rond, bleu, rond, bleu, rond. Ensuite vient le bleu."
      - text: "🍌 🍊 🍌 🍊 🍌 … ensuite vient 🍊."
        speak: "Banane, orange, banane, orange, banane. Ensuite vient l'orange."
    exercises:
      - type: qcm
        text: "Quelle forme vient ensuite ? 🔴 🔺 🔴 🔺 🔴 …"
        speak: "Rond, triangle, rond, triangle, rond. Quelle forme vient ensuite ?"
        options: ["🔺", "🔴", "⬛"]
        answer: "🔺"
        explanation: "La suite alterne rond et triangle. Après le rond vient le triangle."
      - type: qcm
        text: "Quel animal vient ensuite ? 🐱 🐶 🐱 🐶 🐱 …"
        speak: "Chat, chien, chat, chien, chat. Quel animal vient ensuite ?"
        options: ["🐶", "🐱", "🐟"]
        answer: "🐶"
        explanation: "La suite alterne chat et chien. Après le chat vient le chien."
      - type: qcm
        text: "Quel fruit vient ensuite ? 🍌 🍌 🍊 🍌 🍌 …"
        speak: "Banane, banane, orange, banane, banane. Quel fruit vient ensuite ?"
        options: ["🍊", "🍌", "🍎"]
        answer: "🍊"
        explanation: "La suite fait deux bananes puis une orange. Ensuite vient l'orange."
      - type: association
        text: "Relie chaque suite à ce qui vient ensuite."
        pairs:
          "🔴 🔴 🔵 🔴 🔴 …": "🔵"
          "🍎 🍌 🍎 🍌 🍎 …": "🍌"
          "⬛ 🔺 ⬛ 🔺 ⬛ …": "🔺"
        explanation: "On regarde ce qui se répète dans la suite."
      - type: vrai_faux
        text: "Dans la suite 🔴 🔵 🔴 🔵, après le 🔴 vient le 🔵."
        speak: "Dans la suite rond, bleu, rond, bleu, après le rond vient le bleu."
        answer: vrai
        explanation: "La suite alterne rond et bleu."
      - type: vrai_faux
        text: "La suite 🔴 🔺 🔴 🔺 continue avec un ⬛."
        speak: "La suite rond, triangle, rond, triangle continue-t-elle avec un carré ?"
        answer: faux
        explanation: "La suite alterne rond et triangle, pas carré."


